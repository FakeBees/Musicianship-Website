{% extends 'base.html' %}
{% block title %}New {{ section_term_title }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:500px">
  <h2 class="mb-4">Create a New {{ section_term_title }}</h2>
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">{{ section_term_title }} Name</label>
      <input name="name" class="form-control" placeholder="e.g. TEST101-001"
             value="" required>
      <div class="form-text">Name your {{ section_term }} like a section number, e.g. MUS201-002.</div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Course <span class="text-muted fw-normal">(optional)</span></label>
      <select name="course_id" class="form-select">
        <option value="">— No course —</option>
        {% for c in courses %}
        <option value="{{ c.id }}" >
          {{ c.school.name }} / {{ c.name }}
        </option>
        {% endfor %}
      </select>
      <div class="form-text">Selecting a course gives students access to its modules.</div>
    </div>
    <button type="submit" class="btn btn-primary">Create {{ section_term_title }}</button>
    <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
