{% extends 'base.html' %}
{% block title %}Upload MIDI — Admin{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:560px">
  <h2 class="mb-4">Upload MIDI File</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}

  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">MIDI File <span class="text-danger">*</span></label>
      <input type="file" name="midi_file" accept=".mid" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Melody Name</label>
      <input type="text" name="name" class="form-control" placeholder="Leave blank to use filename">
    </div>
    <div class="mb-3">
      <label class="form-label">Key Signature</label>
      <select name="key_signature" class="form-select">
        {% for k in ['C','G','D','A','E','B','F#','F','Bb','Eb','Ab','Db'] %}
        <option value="{{ k }}" {% if k == 'C' %}selected{% endif %}>{{ k }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Time Signature</label>
      <select name="time_signature" class="form-select" required>
        <option value="" disabled selected>Choose…</option>
        {% for ts in ['4/4','3/4','2/4','6/8','9/8','12/8','5/4','7/8'] %}<option>{{ ts }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Tempo (BPM)</label>
      <input name="tempo" type="number" class="form-control" required min="20" max="400" placeholder="e.g. 120" style="max-width:160px">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Upload & Parse</button>
      <a href="{{ url_for('admin_melodies') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
