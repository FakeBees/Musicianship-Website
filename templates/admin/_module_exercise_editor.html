{# The module-exercise editor: add form, exercises table, and edit modal.
   Its companion _module_exercise_editor_js.html has the <script> that
   drives them — always include BOTH, and put the JS one inside the
   including page's {% block scripts %} (not here in {% block content %}),
   so it keeps loading after base.html's Bootstrap bundle. See that file's
   own header comment for why that ordering matters.

   Included by both admin/module_exercises.html (course curriculum) and,
   eventually, a section-level equivalent — nothing here is admin-route-
   specific, so every URL it posts to is passed in by the including page
   rather than hardcoded:

     add_action_url          — where the add form posts (its own page URL)
     edit_url_template        \
     duplicate_url_template    } url_for(..., me_id=0) from the including
     remove_url_template      /  page — the '0' is substituted per-row below

   Besides those four, the caller must supply everything
   admin_module_exercises already renders this template with: module,
   exercises, holistics, all_tags, melody_tags_list, rhythm_tags_list,
   harmonic_tags_list, harmonic_categories, melodies_data, rhythms_data,
   progressions_data — the JS include needs the last three too. #}

{# ── ADD EXERCISE FORM ─────────────────────────────────────────────────── #}
<div class="card mb-4">
  <div class="card-header fw-semibold">Add Exercise</div>
  <div class="card-body">
    <form method="post" id="add-form" action="{{ add_action_url }}">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Type</label>
          <select name="exercise_type" class="form-select" id="ex-type" required>
            <option value="">Choose…</option>
            <option value="melody">Melodic</option>
            <option value="rhythm">Rhythmic</option>
            <option value="harmonic">Harmonic</option>
            <option value="holistic">Holistic</option>
          </select>
        </div>
      </div>

      {% set mode = 'add' %}
      {% include 'admin/_module_exercise_fields.html' with context %}

      {# ── HOLISTIC EXERCISE PICKER (add-only — you choose what an exercise
           IS at creation and change its parameters later) ─────────────── #}
      <div id="holistic-field" class="d-none mb-3">
        <label class="form-label fw-semibold">Exercise</label>
        <select name="exercise_id" class="form-select">
          <option value="">Choose a holistic exercise…</option>
          {% for ex in holistics %}
          <option value="{{ ex.id }}">{{ ex.name }}</option>
          {% endfor %}
        </select>
      </div>

      <button class="btn btn-primary">Add Exercise</button>
    </form>
  </div>
</div>

{# ── EXERCISE TABLE ────────────────────────────────────────────────────── #}
<table class="table table-sm align-middle">
  <thead>
    <tr><th>#</th><th>Name</th><th>Type</th><th>Filters / Exercise</th><th>Completion</th><th></th></tr>
  </thead>
  <tbody>
  {% for ex in exercises %}
  {% set params = ex.params %}
  {% set crit   = ex.completion_criterion %}
  <tr>
    <td>{{ ex.order }}</td>
    <td>{{ ex.name }}</td>
    <td><span class="badge {{ {'melody': 'bg-primary', 'rhythm': 'bg-warning text-dark', 'harmonic': 'bg-success', 'holistic': 'bg-purple'}.get(ex.exercise_type, 'bg-secondary') }}">{{ ex.exercise_type }}</span></td>
    <td class="small">
      {% if ex.exercise_type == 'holistic' %}
        {% set hol = holistics | selectattr('id', 'equalto', ex.exercise_id) | first %}
        <i class="bi bi-music-note-beamed me-1"></i>{{ hol.name if hol else 'ID ' ~ ex.exercise_id }}
      {% elif params %}
        {% if params.get('difficulty') %}
          <span class="me-2">Difficulty: {{ params.difficulty | join(', ') }}</span>
        {% endif %}
        {% if params.get('time_signature') %}
          <span class="me-2">{{ params.time_signature if params.time_signature is string else params.time_signature | join(', ') }}</span>
        {% endif %}
        {% if params.get('key_signature') %}
          <span class="me-2">Key: {{ params.key_signature }}</span>
        {% endif %}
        {% if params.get('tags') %}
          {% for t in params.tags %}<span class="badge bg-light text-dark border me-1">{{ t }}</span>{% endfor %}
        {% endif %}
        {% if not params.get('difficulty') and not params.get('time_signature') and not params.get('tags') and not params.get('key_signature') %}
          <span class="text-muted">Any</span>
        {% endif %}
      {% else %}
        <span class="text-muted">Any</span>
      {% endif %}
    </td>
    <td class="small">
      {% if crit.get('passing') %}
        {{ crit.passing }} pass{{ 'es' if crit.passing != 1 }} at {{ crit.get('min_score', 70) }}%
      {% else %}
        {{ crit.get('attempts', 1) }} attempt{{ 's' if crit.get('attempts', 1) != 1 }}
      {% endif %}
    </td>
    <td>
      <div class="d-flex gap-1">
        <button class="btn btn-sm btn-outline-secondary"
                onclick='openEditModal({{ {"id": ex.id, "name": ex.name, "order": ex.order, "exercise_type": ex.exercise_type, "params_json": ex.params_json, "completion_criterion_json": ex.completion_criterion_json} | tojson }})'>Edit</button>
        <form method="post" action="{{ duplicate_url_template | replace('/0/', '/' ~ ex.id ~ '/') }}">
          <button class="btn btn-sm btn-outline-secondary">Duplicate</button>
        </form>
        <form method="post" action="{{ remove_url_template | replace('/0/', '/' ~ ex.id ~ '/') }}"
              onsubmit="return confirm('Remove this exercise from the module?')">
          <button class="btn btn-sm btn-outline-danger">Remove</button>
        </form>
      </div>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="6" class="text-muted">No exercises yet.</td></tr>
  {% endfor %}
  </tbody>
</table>

{# ── EDIT MODAL ────────────────────────────────────────────────────────────── #}
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Exercise</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form method="post" id="edit-form">
        <div class="modal-body">
          {% set mode = 'edit' %}
          {% include 'admin/_module_exercise_fields.html' with context %}

          <div id="edit-holistic-info" class="d-none">
            <p class="text-muted">Holistic exercises cannot have their filters changed here. To change the exercise, remove and re-add it.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
